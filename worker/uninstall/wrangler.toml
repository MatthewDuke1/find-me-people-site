name = "fmp-uninstall-survey"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Served at https://fmp-uninstall-survey.<your-subdomain>.workers.dev, not on
# trysula.com, so the domain's DNS (and its Zoho mail records) stays on Route 53.
# uninstall.js posts to that URL; the Worker accepts only trysula.com origins.
workers_dev = true

# D1 (SQLite) storage. `database_id` is printed by `wrangler d1 create
# fmp-uninstalls` — paste it here. It is NOT a secret (D1 access still requires
# your authenticated Cloudflare account), so it's safe to commit.
[[d1_databases]]
binding = "DB"
database_name = "fmp-uninstalls"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
